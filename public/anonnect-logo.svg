<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Latar Belakang Gelap khas Anonnect -->
  <rect width="400" height="400" fill="#0B0F19" rx="80" />

  <defs>
    <!-- Gradien Utama (Cyan ke Violet) -->
    <linearGradient id="anonnectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Efek Glow (Cahaya neon) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Gelombang Radar (Mencari Partner) -->
  <circle cx="200" cy="170" r="110" fill="none" stroke="url(#anonnectGradient)" stroke-width="2" stroke-dasharray="8 12" opacity="0.4" />
  <circle cx="200" cy="170" r="75" fill="none" stroke="url(#anonnectGradient)" stroke-width="2" opacity="0.6" />

  <!-- Ikon Chat Bubble Utama -->
  <path d="M 200 90 C 145 90 100 125 100 170 C 100 195 115 217 137 231 L 120 270 L 165 255 C 176 258 188 260 200 260 C 255 260 300 225 300 170 C 300 125 255 90 200 90 Z" fill="url(#anonnectGradient)" filter="url(#glow)"/>

  <!-- Simbol Anonim (Kacamata/Mata tersembunyi) -->
  <circle cx="160" cy="165" r="16" fill="#0B0F19" />
  <circle cx="240" cy="165" r="16" fill="#0B0F19" />
  <!-- Garis lengkung senyum / kacamata -->
  <path d="M 176 165 C 185 180 215 180 224 165" fill="none" stroke="#0B0F19" stroke-width="6" stroke-linecap="round" />

  <!-- Teks Logo -->
  <text x="200" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">ANONNECT</text>
  <text x="200" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">SECURE CHAT</text>
</svg>
